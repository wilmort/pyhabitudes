[project]
name = "pyhabitudes"
version = "0.1.0"
description = "Literate-programming notebooks quarried from the texts I read."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "networkx>=3.3",
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "ipykernel>=7.3",
]

[tool.uv]
package = false

[tool.jupytext]
formats = "py:percent,ipynb"
